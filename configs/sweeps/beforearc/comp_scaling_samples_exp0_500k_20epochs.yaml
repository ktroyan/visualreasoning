# NOTE: The parameters structure should follow that of the nested keys used in the config files in /configs by using "parameters" to create imbrication

# Program to run
program: experiment.py

# Use grid method since we sweep over experiments and not peform HP optimization.
method: grid

# This does not matter as we do not perform any optimization
# metric:
#   goal: minimize
#   name: metrics/val_loss_epoch

parameters:
  base:
    parameters:
      data_env:
        values: ['BEFOREARC']

  # model:
  #   parameters:
  #     backbone:
  #       # values: ['resnet']
  #       # values: ['vit']
  #       # values: ['looped_vit']
  #       # values: ['diffusion_vit']
  #     head:
  #       # values: ['mlp']
  
  experiment:
    parameters:
      study:
        values: ['compositionality']
      setting:
        values: ['exp_setting_1', 'exp_setting_2', 'exp_setting_3']
      name:
        # values: ['experiment_0_500k', 'experiment_1_500k']
        values: ['experiment_0_500k']
      exp_specifics:
        values: ['scaling_500k']

  data:
    parameters:
      max_train_samples:
        values: [500000] # set the maximum number of training samples
  
  training:
    parameters:
      max_epochs:
        values: [20]  # set the maximum number of training epochs